# Local services. Start with `docker compose up -d --build airflow` (or `make airflow-docker-up`,
# or `scripts\run.cmd airflow-docker-up` on Windows).
#
#   Airflow UI          http://localhost:8080   (no login: local use only)
#   MLflow UI (Docker)  http://localhost:5001   (runs made inside the container)
services:
  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: pii-redaction-airflow
    ports:
      - "8080:8080"
      - "5001:5001"
    volumes:
      - .:/app                    # repository: code, DAGs, configs and data/ shared with the host
      - airflow-state:/state      # Airflow DB + logs, container MLflow, models and reports
    environment:
      AIRFLOW_HOME: /state/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /app/pipelines/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Local demo: every visitor is admin, no password. Never expose this port publicly.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      PII_CONFIG_OVERRIDES: configs/docker_overrides.yaml
      MLFLOW_DISABLE_AGENT_HINT: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      GIT_PYTHON_REFRESH: quiet

  # GPU training (NVIDIA only). Not started by `docker compose up`; run one training with
  #   docker compose run --rm trainer-gpu train --config configs/experiments/<name>.yaml
  # (or `make train-gpu CONFIG=...` / `scripts\run.cmd train-gpu -Config ...`).
  trainer-gpu:
    profiles: [gpu]
    build:
      context: .
      dockerfile: docker/gpu.Dockerfile
    image: pii-redaction-gpu
    volumes:
      - .:/app                    # code, configs, data/, artifacts/ and reports/ shared with the host
      - airflow-state:/state      # Docker MLflow store, shared with Airflow (UI on :5001)
      - cuda-cache:/cache         # compiled GPU kernels, so the one-time compile isn't repeated
    environment:
      PII_CONFIG_OVERRIDES: configs/docker_gpu_overrides.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  airflow-state:
  cuda-cache:
